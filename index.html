<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>미스테리 RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login/Register Screen -->
    <div id="login-screen">
        <div class="login-container">
            <h1 class="game-title">미스테리 RPG</h1>
            <div class="login-box">
                <div id="login-tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('login')">로그인</button>
                    <button class="tab-btn" onclick="switchTab('register')">회원가입</button>
                </div>
                <div id="login-form">
                    <input type="text" id="login-nickname" placeholder="닉네임" required>
                    <input type="password" id="login-password" placeholder="비밀번호" required>
                    <button id="login-btn" onclick="handleLogin()">로그인</button>
                </div>
                <div id="register-form" style="display:none;">
                    <input type="text" id="reg-nickname" placeholder="닉네임 (필수)" required>
                    <input type="password" id="reg-password" placeholder="비밀번호 (필수)" required>
                    <button id="reg-btn" onclick="handleRegister()">회원가입</button>
                </div>
                <p id="auth-message"></p>
                <input type="hidden" id="db-url" value="https://rpg-gaim-default-rtdb.asia-southeast1.firebasedatabase.app/">
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" style="display:none;">
        <!-- 3D Canvas rendered by Three.js -->
        <canvas id="game-canvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div id="player-info">
                <div id="player-name-display"></div>
                <div id="level-display">Lv.1</div>
                <div id="health-bar-container">
                    <div id="health-bar"></div>
                    <span id="health-text">100 / 100</span>
                </div>
                <div id="xp-bar-container">
                    <div id="xp-bar"></div>
                    <span id="xp-text">0 / 50</span>
                </div>
                <div id="currency-display">
                    <span id="coin-display">코인: 0</span>
                    <span id="diamond-display">다이아: 0</span>
                </div>
            </div>
            <div id="online-indicator">
                <span id="online-dot"></span>
                <span id="online-count">온라인: 1</span>
            </div>
        </div>

        <!-- Quest Display -->
        <div id="quest-display" style="display:none;">
            <div id="quest-text"></div>
        </div>

        <!-- Enemy HP Bar -->
        <div id="enemy-hp-container" style="display:none;">
            <div id="enemy-name"></div>
            <div id="enemy-hp-bar-bg">
                <div id="enemy-hp-bar"></div>
            </div>
            <span id="enemy-hp-text"></span>
        </div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" style="display:none;">
            <div id="dialogue-speaker"></div>
            <div id="dialogue-text"></div>
            <div id="dialogue-prompt">F키를 누르시오.</div>
        </div>

        <!-- Interaction Prompt -->
        <div id="interact-prompt" style="display:none;">
            <span>F키를 누르시오.</span>
        </div>

        <!-- Investigation Text -->
        <div id="investigation-text" style="display:none;"></div>

        <!-- Stage Transition -->
        <div id="stage-transition" style="display:none;">
            <div id="stage-text"></div>
        </div>

        <!-- Death Screen -->
        <div id="death-screen" style="display:none;">
            <div class="death-content">
                <h2>사망했습니다</h2>
                <button id="respawn-btn" onclick="respawnPlayer()">부활</button>
            </div>
        </div>

        <!-- Item Acquired Notification -->
        <div id="item-notification" style="display:none;">
            <div id="item-notif-text"></div>
        </div>

        <!-- Damage Numbers -->
        <div id="damage-numbers"></div>

        <!-- Inventory -->
        <div id="inventory-screen" style="display:none;">
            <div class="inventory-header">
                <h2>인벤토리</h2>
                <button onclick="toggleInventory()">X</button>
            </div>
            <div id="inventory-grid"></div>
            <div id="item-detail" style="display:none;">
                <div id="item-detail-name"></div>
                <div id="item-detail-desc"></div>
                <button id="item-use-btn" style="display:none;">사용</button>
            </div>
        </div>

        <!-- Shop -->
        <div id="shop-screen" style="display:none;">
            <div class="shop-header">
                <h2>상점</h2>
                <button onclick="toggleShop()">X</button>
            </div>
            <div id="shop-items"></div>
        </div>

        <!-- Roulette -->
        <div id="roulette-screen" style="display:none;">
            <div class="roulette-header">
                <h2>룰렛</h2>
                <button onclick="toggleRoulette()">X</button>
            </div>
            <canvas id="roulette-canvas" width="300" height="300"></canvas>
            <button id="roulette-spin-btn" onclick="spinRoulette()">돌리기 (10 코인)</button>
            <div id="roulette-result"></div>
        </div>

        <!-- Document Viewer -->
        <div id="document-viewer" style="display:none;">
            <div class="doc-header">
                <h2 id="doc-title"></h2>
                <button onclick="closeDocument()">X</button>
            </div>
            <div id="doc-content"></div>
        </div>

        <!-- Mobile Joystick -->
        <div id="mobile-joystick" style="display:none;">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
            </div>
        </div>

        <!-- Mobile Attack Button -->
        <div id="mobile-attack-btn" style="display:none;">공격</div>
        <div id="mobile-interact-btn" style="display:none;">F</div>

        <!-- Menu Buttons -->
        <div id="menu-buttons">
            <button onclick="toggleInventory()">인벤토리 (I)</button>
            <button onclick="toggleEquipment()">장비 (E)</button>
            <button onclick="toggleShop()">상점 (P)</button>
            <button onclick="toggleRoulette()">룰렛 (R)</button>
            <button onclick="toggleRanking()">랭킹 (L)</button>
            <button onclick="toggleChat()">채팅 (T)</button>
            <button id="sound-btn" onclick="toggleSound()">🔊</button>
            <button id="admin-menu-btn" onclick="toggleAdmin()" style="display:none;">관리자 (~)</button>
        </div>

        <!-- Admin Panel -->
        <div id="admin-panel" style="display:none;">
            <div class="admin-header">
                <h2>관리자 패널</h2>
                <span id="admin-role-badge"></span>
                <button onclick="toggleAdmin()">X</button>
            </div>
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchAdminTab('players')">플레이어</button>
                <button class="admin-tab" onclick="switchAdminTab('give')">지급</button>
                <button class="admin-tab" onclick="switchAdminTab('self')">내 설정</button>
                <button class="admin-tab" id="super-tab" style="display:none;" onclick="switchAdminTab('super')">최고관리</button>
            </div>
            <div id="admin-tab-players" class="admin-content">
                <button onclick="loadPlayerList()" class="admin-action-btn">플레이어 목록 새로고침</button>
                <div id="player-list"></div>
            </div>
            <div id="admin-tab-give" class="admin-content" style="display:none;">
                <div class="admin-field">
                    <label>대상 닉네임</label>
                    <input type="text" id="admin-target" placeholder="닉네임 입력">
                </div>
                <div class="admin-field">
                    <label>코인 지급</label>
                    <div class="admin-row">
                        <input type="number" id="admin-coins" value="100">
                        <button onclick="adminGiveCoins()">지급</button>
                    </div>
                </div>
                <div class="admin-field">
                    <label>다이아 지급</label>
                    <div class="admin-row">
                        <input type="number" id="admin-diamonds" value="10">
                        <button onclick="adminGiveDiamonds()">지급</button>
                    </div>
                </div>
                <div class="admin-field">
                    <label>HP 설정</label>
                    <div class="admin-row">
                        <input type="number" id="admin-hp" value="100">
                        <button onclick="adminSetHp()">설정</button>
                    </div>
                </div>
                <div class="admin-field">
                    <label>스테이지 설정</label>
                    <div class="admin-row">
                        <input type="number" id="admin-stage" value="1" min="1" max="3">
                        <button onclick="adminSetStage()">설정</button>
                    </div>
                </div>
                <div class="admin-field">
                    <button onclick="adminResetPlayer()" class="admin-danger-btn">대상 초기화</button>
                </div>
                <div id="admin-give-msg"></div>
            </div>
            <div id="admin-tab-self" class="admin-content" style="display:none;">
                <button onclick="adminGodMode()" class="admin-action-btn" id="godmode-btn">갓모드 ON</button>
                <button onclick="adminTeleport('village')" class="admin-action-btn">마을로 이동</button>
                <button onclick="adminTeleport('mountain')" class="admin-action-btn">산으로 이동</button>
                <button onclick="adminTeleport('mine')" class="admin-action-btn">폐광으로 이동</button>
                <button onclick="adminTeleport('boss')" class="admin-action-btn">보스방으로 이동</button>
                <button onclick="adminMaxStats()" class="admin-action-btn">스탯 최대화</button>
                <button onclick="adminSpawnSnake()" class="admin-action-btn">독사 소환</button>
                <button onclick="adminSpawnBoss()" class="admin-action-btn">보스 소환</button>
            </div>
            <div id="admin-tab-super" class="admin-content" style="display:none;">
                <div class="admin-field">
                    <label>권한 변경 대상</label>
                    <input type="text" id="admin-role-target" placeholder="닉네임 입력">
                </div>
                <div class="admin-row">
                    <button onclick="adminSetRole('admin')" class="admin-action-btn">관리자 부여</button>
                    <button onclick="adminSetRole('player')" class="admin-danger-btn">관리자 해제</button>
                </div>
                <div class="admin-field">
                    <label>플레이어 삭제</label>
                    <input type="text" id="admin-delete-target" placeholder="삭제할 닉네임">
                    <button onclick="adminDeletePlayer()" class="admin-danger-btn">삭제</button>
                </div>
                <div id="admin-super-msg"></div>
            </div>
        </div>

        <!-- Equipment Screen -->
        <div id="equipment-screen" style="display:none;">
            <div class="equip-header">
                <h2>장비</h2>
                <button onclick="toggleEquipment()">X</button>
            </div>
            <div id="equip-slots"></div>
            <div id="equip-stats"></div>
        </div>

        <!-- Ranking Screen -->
        <div id="ranking-screen" style="display:none;">
            <div class="ranking-header">
                <h2>랭킹</h2>
                <button onclick="toggleRanking()">X</button>
            </div>
            <div id="ranking-list"></div>
        </div>

        <!-- Chat Panel -->
        <div id="chat-panel" style="display:none;">
            <div id="chat-messages"></div>
            <div id="chat-input-row">
                <input type="text" id="chat-input" placeholder="메시지 입력..." maxlength="100" autocomplete="off">
                <button onclick="sendChatMessage()">전송</button>
            </div>
        </div>

        <!-- Minimap -->
        <canvas id="minimap-canvas" width="150" height="150"></canvas>

        <!-- Party Display -->
        <div id="party-display" style="display:none;"></div>

        <!-- Crosshair -->
        <div id="crosshair">+</div>

        <!-- Mini Instructions -->
        <div id="controls-hint">
            WASD/방향키: 이동 | 마우스: 시점 | 클릭: 공격 | F: 상호작용 | I: 인벤토리
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="GLTFLoader.js"></script>
    <script src="game.js"></script>
</body>
</html>
